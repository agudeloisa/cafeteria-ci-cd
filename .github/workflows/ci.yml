name: CI-CD Cafeteria
on: 
   push: 
   workflow_dispatch: 
permissions: 
  contents: read
jobs:
  validar:
    name: CI - Validar programa
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v7
      - name: preparar Node.js
        uses: actions/setup-node@v7
        with:
           node-version: '24'
           package-manager-cache: false
      - name:  Ejecutar pruebas
        run: node --test pedido.test.js
   entregar:
      name: CD - Preparar entrega
      needs:  validar
      runs-on: ubuntu-latests
      steps:
        - name: Descargar proyecto
          uses: actions/checkout@v7
        - name: Guardar artefacto
          uses: actions/uploaf-artifact@v7
          with:
            name: pedido-valido
            path: pedido.js
